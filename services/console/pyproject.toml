[project]
name = "console"
version = "0.1.0"
description = "ServicioCerca - Consola de operación (Feature 4) en Streamlit."
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "pyvis>=0.3.2",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# pyvis no publica tipos (sin py.typed); se aísla en console/graph_view.py (ADR 0006).
[[tool.mypy.overrides]]
module = ["pyvis", "pyvis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=console --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.report]
exclude_also = ["\\.\\.\\.$"]
omit = ["src/console/app.py"]
