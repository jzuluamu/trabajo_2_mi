<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src {{ script_hashes|safe }}; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: {{ canvas }}; color: #0F2540;
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .frame { position: relative; height: {{ height }}px; border: 1px solid #DCE5F0; border-radius: 16px;
    overflow: hidden; background-color: {{ canvas }};
    background-image: radial-gradient(#DCE5F0 1px, transparent 1px); background-size: 24px 24px; }
  #graph { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
  #graph.ready { opacity: 1; }
  .toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 2; }
  .toolbar button { min-width: 40px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #DCE5F0;
    background: #FFFFFF; color: #174A96; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 1px 2px rgba(15, 37, 64, .08); transition: background .2s ease; }
  .toolbar button:hover { background: #E8F0FB; }
  .toolbar button:focus-visible { outline: 3px solid #F2B661; outline-offset: 2px; }
  .legend { position: absolute; right: 12px; bottom: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 14px;
    max-width: calc(100% - 24px); padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .94);
    border: 1px solid #DCE5F0; font-size: 12px; color: #4A5D78; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sq { width: 13px; height: 13px; border-radius: 3px; background: #1F5FBF; }
  .sq.idle { background: #8CA3C3; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #DCEBFB; border: 2px solid #5B8FD6; }
  .dot.off { background: #F1F4F8; border: 2px dashed #9AA8BA; }
  .line { width: 20px; height: 2px; background: #8FA9CC; }
  .arrow { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    border-left: 8px solid #8FA9CC; margin-left: -6px; }
  .hint { position: absolute; right: 14px; top: 22px; z-index: 1; font-size: 12px; color: #4A5D78; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #4A5D78; font-size: 15px; padding: 24px; text-align: center; }
  div.vis-tooltip { position: absolute; visibility: hidden; padding: 8px 12px; white-space: nowrap;
    font-size: 13px; color: #FFFFFF; background: #0F2540; border-radius: 10px; pointer-events: none;
    box-shadow: 0 8px 24px rgba(15, 37, 64, .25); z-index: 5; }
</style>
</head>
<body>
<div class="frame">
  {% if empty %}
  <div class="empty">La red está vacía. El coordinador puede registrar nodos o cargar la red demo.</div>
  {% else %}
  <div class="toolbar">
    <button type="button" id="zoom-out" aria-label="Alejar">−</button>
    <button type="button" id="zoom-in" aria-label="Acercar">+</button>
    <button type="button" id="zoom-fit">Ajustar</button>
    <button type="button" id="relayout">Reorganizar</button>
  </div>
  <div id="graph" role="img" aria-label="Mapa de la red de cobertura: bases, zonas y trayectos"></div>
  <div class="hint">Arrastre nodos · rueda para zoom · toque un nodo para resaltar sus trayectos</div>
  <div class="legend" aria-hidden="true">
    <span><i class="sq"></i>Base</span>
    <span><i class="sq idle"></i>Sin técnicos libres</span>
    <span><i class="dot"></i>Zona</span>
    <span><i class="dot off"></i>Sin conexión</span>
    <span><i class="line"></i>Ambos sentidos</span>
    <span><i class="line"></i><i class="arrow"></i>Solo ida</span>
  </div>
  {% endif %}
</div>
<script id="graph-data" type="application/json">{{ data|tojson }}</script>
{% if not empty %}
<script>{{ vis_js|safe }}</script>
<script>{{ app_js|safe }}</script>
{% endif %}
</body>
</html>
